# ===============================
# Application & Server Configuration
# ===============================
spring.application.name=BookStore
server.port=${PORT:8082}

# GZIP Response Compression (Reduces JSON Payload Size)
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/xml,text/html
server.compression.min-response-size=1024

# ===============================
# PostgreSQL (Supabase Direct / Session Pooler - IPv4)
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.gohfhpxyueyqblywrqum
spring.datasource.password=${DB_PASSWORD:BookStore@12435}

# Hikari Pooler Configuration
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# JWT Security
# ===============================
jwt.secret=${JWT_SECRET:ecartSecretKey1234567890abcdefghijklmnopqrstuvwxyz}
jwt.expiration=86400000

bookstore.jwt.secret=${JWT_SECRET:ecartSecretKey1234567890abcdefghijklmnopqrstuvwxyz}
bookstore.jwt.expirationMs=86400000

# ===============================
# Frontend Integration
# ===============================
bookstore.frontend.url=${FRONTEND_URL:http://localhost:4200}

# ===============================
# Cloudinary Image Storage
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:y0f6ze4v}
cloudinary.api-key=${CLOUDINARY_API_KEY:141192398531912}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:NCLzEA16b1bXM3vRpA1qSu3RYWY}

# ===============================
# Supabase Storage Configuration
# ===============================
bookstore.supabase.url=https://kqzncoqscbgezhupvnqd.supabase.co
bookstore.supabase.bucket=book-images

# ===============================
# Logging Configuration
# ===============================
logging.level.org.springframework=INFO
logging.level.com.bookstore=INFO